name: Build Tattoo Expansion Sources

on:
  push:
    paths:
      - '.github/workflows/build-tattoo-images.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch public tattoo sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/highres/male out/highres/female out/noxify out/sincity

          git clone --depth 1 https://github.com/doiska/fivem-tattoo-shop.git /tmp/doiska
          git clone --depth 1 https://github.com/untraceabledev/Noxify4.0TurkishScammer.git /tmp/noxify
          git clone --depth 1 https://github.com/lnfernous/resources-frommain.git /tmp/resources

          cp /tmp/doiska/config/tattoos.json out/doiska_tattoos.json
          cp /tmp/doiska/shared/assets/zone_new_tattoos.json out/doiska_zone_new_tattoos.json

          python - <<'PY'
          import json, pathlib, shutil, os
          src=pathlib.Path('/tmp/doiska/web/public/tattoos')
          data=json.load(open('/tmp/doiska/config/tattoos.json'))
          out=pathlib.Path('out/highres')
          copied=0
          for e in data:
              img=(e.get('image') or '').replace('/tattoos/','')
              p=src/img
              if not img or not p.exists():
                  continue
              for sex,key in [('male','hashMale'),('female','hashFemale')]:
                  h=e.get(key) or ''
                  if not h:
                      continue
                  dst=out/sex/(h+'.webp')
                  if not dst.exists():
                      shutil.copy2(p,dst); copied+=1
          print('highres copied',copied)
          print('male',len(list((out/'male').glob('*.webp'))),'female',len(list((out/'female').glob('*.webp'))))
          PY

          NP='/tmp/noxify/GTAServerFXS/server-data/resources/[assets]/np_tattoos'
          cp "$NP/nikeztattoos_overlays.xml" out/noxify/
          cp "$NP/shop_tattoo.meta" out/noxify/
          cp "$NP/cl_names.lua" out/noxify/
          cp -r "$NP/stream" out/noxify/

          cp /tmp/resources/rcore_addon_tattoos_sincity/rcore_overlays_sincity.xml out/sincity/
          cp /tmp/resources/rcore_addon_tattoos_sincity/fxmanifest.lua out/sincity/
          cp -r /tmp/resources/rcore_addon_tattoos_sincity/stream out/sincity/
          cp /tmp/resources/rcore_tattoo/assets/tattooLists/rcoreAddonTattoos_sincity.json out/sincity/

          echo '--- sizes ---'
          du -sh out/*
          find out/highres -type f | wc -l
          find out/noxify/stream -type f | wc -l
          find out/sincity/stream -type f | wc -l

      - name: Upload expansion sources
        uses: actions/upload-artifact@v4
        with:
          name: tattoo-expansion-sources
          path: out
          compression-level: 6
          if-no-files-found: error
          retention-days: 1
